query Badge($id: ID!) {
  badge(id: $id) {
    id
    name
    description
    isOfficial
    isCommunity
    uri
    hookAddress
    imageUrl
    creatorAddress
    createdAt
    holdersCount
    profileUser {
      name
    }
    holders {
      id
      name
      bio
      imageUrl
    }
    managers {
      id
      name
      bio
      imageUrl
    }
    minters {
      id
      name
      profileUser {
        name
      }
      holders {
        id
      }
    }
    burners {
      id
      name
      profileUser {
        name
      }
      holders {
        id
      }
    }
    transferers {
      id
      name
      profileUser {
        name
      }
      holders {
        id
      }
    }
  }
}
