query Communities(
  $first: Int!
  $skip: Int!
  $orderBy: Community_orderBy!
  $orderDirection: OrderDirection!
  $where: Community_filter
) {
  communities(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    id
    name
    description
    imageUrl
    createdAt
    tierId
    tierName
    tierExpiresAt
    managerAddress
    manager {
      id
      name
      bio
      imageUrl
    }
    memberCount
  }
}
