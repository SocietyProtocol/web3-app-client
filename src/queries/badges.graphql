query Badges(
  $first: Int!
  $skip: Int!
  $orderBy: Badge_orderBy!
  $orderDirection: OrderDirection!
  $where: Badge_filter
) {
  badges(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    id
    name
    isOfficial
    isCommunity
    uri
    hookAddress
    imageUrl
    creatorAddress
    createdAt
    holdersCount
    createdBy {
      id
      name
      bio
      imageUrl
    }
    holders {
      id
      name
      bio
      imageUrl
    }
    managers {
      id
      name
      bio
      imageUrl
    }
    minters {
      id
      name
      holders {
        id
        name
        bio
        imageUrl
      }
    }
    burners {
      id
      name
      holders {
        id
        name
        bio
        imageUrl
      }
    }
    transferers {
      id
      name
      holders {
        id
        name
        bio
        imageUrl
      }
    }
  }
}
