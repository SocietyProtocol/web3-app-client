query Users(
  $first: Int!
  $skip: Int!
  $orderBy: User_orderBy!
  $orderDirection: OrderDirection!
  $where: User_filter
) {
  users(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    id
    name
    bio
    imageUrl
    profile {
      id
    }
    invitedBy {
      id
      name
      bio
      imageUrl
    }
    badges(where: { isProfile: false }) {
      id
      name
      isOfficial
      isCommunity
      uri
      hookAddress
      imageUrl
      creatorAddress
      createdAt
      holdersCount
      community {
        id
        name
      }
      createdBy {
        id
        name
        bio
        imageUrl
      }
      holders {
        id
        name
        bio
        imageUrl
      }
      managers {
        id
        name
        bio
        imageUrl
      }
      minters {
        id
        name
        holders {
          id
        }
      }
      burners {
        id
        name
        holders {
          id
        }
      }
      transferers {
        id
        name
        holders {
          id
        }
      }
    }
    managedBadges(where: { isProfile: false }) {
      id
      name
      isOfficial
      isCommunity
      uri
      hookAddress
      imageUrl
      creatorAddress
      createdAt
      holdersCount
      createdBy {
        id
        name
        bio
        imageUrl
      }
      holders {
        id
        name
        bio
        imageUrl
      }
      managers {
        id
        name
        bio
        imageUrl
      }
      minters {
        id
        name
        holders {
          id
        }
      }
      burners {
        id
        name
        holders {
          id
        }
      }
      transferers {
        id
        name
        holders {
          id
        }
      }
    }
  }
}
