query User($id: ID!) {
  user(id: $id) {
    id
    name
    bio
    imageUrl
    communities {
      id
    }
    profile {
      id
    }
    invitedBy {
      id
      name
      bio
      imageUrl
    }
    badges(where: { isProfile: false }) {
      id
      name
      description
      isOfficial
      isCommunity
      uri
      hookAddress
      imageUrl
      creatorAddress
      createdAt
      holdersCount
      community {
        id
        name
      }
      createdBy {
        id
        name
        bio
        imageUrl
      }
      holders {
        id
        name
        bio
        imageUrl
      }
      managers {
        id
        name
        bio
        imageUrl
      }
      minters {
        id
        name
        holders {
          id
        }
      }
      burners {
        id
        name
        holders {
          id
        }
      }
      transferers {
        id
        name
        holders {
          id
        }
      }
    }
    managedBadges(where: { isProfile: false }) {
      id
      name
      description
      isOfficial
      isCommunity
      uri
      hookAddress
      imageUrl
      creatorAddress
      createdAt
      holdersCount
      createdBy {
        id
        name
        bio
        imageUrl
      }
      holders {
        id
        name
        bio
        imageUrl
      }
      managers {
        id
        name
        bio
        imageUrl
      }
      minters {
        id
        name
        holders {
          id
        }
      }
      burners {
        id
        name
        holders {
          id
        }
      }
      transferers {
        id
        name
        holders {
          id
        }
      }
    }
  }
}
