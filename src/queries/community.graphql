query Community($id: ID!) {
  community(id: $id) {
    id
    name
    description
    imageUrl
    createdAt
    tierId
    tierName
    tierExpiresAt
    managerAddress
    manager {
      id
      name
      bio
      imageUrl
    }
    managerBadge {
      id
    }
    memberBadge {
      id
    }
    memberCount
    badges(first: 100) {
      id
      name
    }
  }
}
