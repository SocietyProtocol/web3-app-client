query Users(
  $first: Int!
  $skip: Int!
  $orderBy: User_orderBy!
  $orderDirection: OrderDirection!
  $where: User_filter
) {
  users(
    first: $first
    skip: $skip
    orderBy: $orderBy
    orderDirection: $orderDirection
    where: $where
  ) {
    id
    name
    bio
    imageUrl
    metadata {
      name
      bio
      imageUrl
    }
    profile {
      id
    }
  }
}
