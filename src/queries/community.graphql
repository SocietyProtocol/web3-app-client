query Community($id: ID!) {
  community(id: $id) {
    id
    name
    description
    imageUrl
    createdAt
    tierId
    tierName
    tierExpiresAt
    managerAddress
    manager {
      id
      name
      bio
      imageUrl
    }
    managerBadge {
      id
    }
    memberBadge {
      id
    }
    memberCount
    members(first: 1000, skip: 0) {
      id
      name
      bio
      imageUrl
    }
    badges(first: 100) {
      id
      name
    }
  }
  memberJoinedActivities(
    first: 1000
    skip: 0
    orderBy: timestamp
    orderDirection: desc
    where: { community_: { id: $id } }
  ) {
    id
    timestamp
    user {
      id
    }
  }
}
